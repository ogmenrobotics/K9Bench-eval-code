# =============================================
# Configuration for Gemini Dog Info Generator
# =============================================

api_keys:
  - "GEMINI_API_KEY_1"     # ← Change to your real key(s)
  - "GEMINI_API_KEY_2"                                            # Add more keys if you have

model_name: "gemini-1.5-flash"                   

# Input Files
video_ids_file: "../../data/meta_info/video_metadata/filtered_video_ids.txt"
narration_dir: "../../data/intermediary_files/narration/outputs"     # Folder containing *_narrations.json files

# Prompt
prompt_file: "../../data/meta_info/prompts/bias_mitigation/prompt_speaker_retrieval.txt"

# Output Settings
output_dir: "../../data/intermediary_files/bias_mitigation/speaker_information/outputs/"   # Where *_high_level_info.json will be saved
failed_log: "../../data/meta_info/logs/bias_mitigation/speaker_information/failed_speaker_info.log"

# Rate Limiting
rate_limit_rpm: 12
rate_limit_tpm: 1000000

# Processing Settings
max_retries: 3
