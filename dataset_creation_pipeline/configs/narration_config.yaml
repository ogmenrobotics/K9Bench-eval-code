# =============================================
# Configuration for Gemini Video Narration Agent
# =============================================

api_keys:
  - "GEMINI_API_KEY_1"     # ← Change to your real key(s)
  - "GEMINI_API_KEY_2"                                            # Add more keys if you have

model_name: "gemini-2.5-flash"

# Input Paths
video_ids_file: "../../data/meta_info/video_metadata/filtered_video_ids.txt"
prompt_file: "../../data/meta_info/prompts/prompt_narration.txt"

# Output Paths
output_dir: "../../data/intermediary_files/narration/outputs"        # Where JSON files will be saved
failed_log: "../../data/meta_info/logs/narration/failed_videos.log"

# Rate Limiting
rate_limit_rpm: 10
rate_limit_tpm: 250000

# Processing Settings
upload_timeout: 300
max_retries: 3
